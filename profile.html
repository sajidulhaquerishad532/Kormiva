<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kormiva — My Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#eff6ff,#ecfeff);
min-height:100vh;padding:25px;color:#0f172a
}
.container{max-width:650px;margin:auto}
.top{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:20px
}
.logo{
font-size:28px;font-weight:900;color:#2563eb;
text-decoration:none
}
.top button{
border:0;background:#2563eb;color:#fff;
padding:10px 15px;border-radius:9px;
font-weight:700;cursor:pointer
}
.card{
background:#fff;border-radius:25px;
padding:30px;box-shadow:0 25px 70px rgba(15,23,42,.13)
}
.title{text-align:center;margin-bottom:5px;font-size:28px}
.subtitle{text-align:center;color:#64748b;margin-bottom:25px}
.avatar-area{text-align:center;margin-bottom:25px}
.avatar{
width:135px;height:135px;border-radius:50%;
object-fit:cover;border:5px solid #dbeafe;
background:#eff6ff
}
.photo-btn{
display:inline-block;margin-top:12px;padding:10px 15px;
background:#eff6ff;color:#2563eb;border-radius:9px;
font-weight:800;cursor:pointer
}
#photoInput{display:none}
label{display:block;font-weight:800;margin:15px 0 7px}
input,textarea{
width:100%;padding:13px;border:1px solid #cbd5e1;
border-radius:10px;font-size:15px;outline:none
}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{
border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe
}
.email{background:#f1f5f9}
.save{
width:100%;border:0;padding:15px;margin-top:22px;
background:#2563eb;color:#fff;border-radius:11px;
font-size:16px;font-weight:900;cursor:pointer
}
.save:disabled{opacity:.6}
.message{
display:none;margin-bottom:18px;padding:12px;
border-radius:10px;font-size:14px
}
.message.show{display:block}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.info{background:#dbeafe;color:#1e40af}
.note{
margin-top:15px;padding:13px;border-radius:10px;
background:#f8fafc;color:#64748b;font-size:13px
}
.loading{text-align:center;padding:40px;color:#64748b}
</style>
</head>

<body>

<div class="container">

<div class="top">
<a href="index.html" class="logo">Kormiva</a>
<button onclick="location.href='index.html'">Home</button>
</div>

<div class="card">

<h1 class="title">My Profile</h1>
<p class="subtitle">Manage your Kormiva profile</p>

<div id="message" class="message"></div>

<div id="loading" class="loading">
Loading your profile...
</div>

<div id="profileContent" style="display:none">

<div class="avatar-area">

<img
id="avatarPreview"
class="avatar"
src="https://ui-avatars.com/api/?name=Kormiva&background=2563eb&color=fff"
alt="Profile Picture">

<br>

<label for="photoInput" class="photo-btn">
📷 Change Profile Picture
</label>

<input
id="photoInput"
type="file"
accept="image/jpeg,image/png,image/webp">

</div>

<label>Full Name</label>
<input id="fullName" type="text" placeholder="Your full name">

<label>Email</label>
<input id="email" class="email" type="email" readonly>

<label>Phone</label>
<input id="phone" type="tel" placeholder="Your phone number">

<label>Role</label>
<input id="role" type="text" placeholder="Student / Job Seeker / Freelancer">

<label>Bio</label>
<textarea id="bio" placeholder="Tell us about yourself..."></textarea>

<button id="saveButton" class="save">
💾 Save Profile
</button>

<div class="note">
📌 Profile picture: JPEG, PNG or WebP — maximum 10 MB.
</div>

</div>

</div>
</div>

<script>
const SUPABASE_URL="https://jobhfmjbvxstyjlpxnpp.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_imDL1J97UKXC7wDh8awxBw_VtzH1N60";

const supabaseClient=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

let currentUser=null;
let selectedFile=null;
let currentAvatarUrl="";

function message(text,type){
const box=document.getElementById("message");
box.textContent=text;
box.className="message show "+type;
}

function clearMessage(){
document.getElementById("message").className="message";
}

async function loadProfile(){

const {data,error}=await supabaseClient.auth.getUser();

if(error || !data.user){
location.href="auth.html";
return;
}

currentUser=data.user;

document.getElementById("email").value=currentUser.email || "";

const {data:profile,error:profileError}=await supabaseClient
.from("Profile")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(profileError){
console.log(profileError.message);
}

if(profile){

document.getElementById("fullName").value=
profile["full name"] || profile.full_name || "";

document.getElementById("phone").value=
profile.phone || "";

document.getElementById("role").value=
profile.role || "";

document.getElementById("bio").value=
profile.bio || "";

currentAvatarUrl=profile.avatar_url || "";

if(currentAvatarUrl){
document.getElementById("avatarPreview").src=currentAvatarUrl;
}else{
setAvatarFallback();
}

}else{

const metadata=currentUser.user_metadata || {};

document.getElementById("fullName").value=
metadata.full_name || "";

document.getElementById("phone").value=
metadata.phone || "";

document.getElementById("role").value=
metadata.role || "";

setAvatarFallback();

}

document.getElementById("loading").style.display="none";
document.getElementById("profileContent").style.display="block";
}

function setAvatarFallback(){

const name=document.getElementById("fullName").value || "Kormiva";

document.getElementById("avatarPreview").src=
"https://ui-avatars.com/api/?name="+
encodeURIComponent(name)+
"&background=2563eb&color=fff";
}

document.getElementById("fullName").addEventListener("input",setAvatarFallback);

document.getElementById("photoInput").addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

const allowed=[
"image/jpeg",
"image/png",
"image/webp"
];

if(!allowed.includes(file.type)){
message("Only JPEG, PNG or WebP images are allowed.","error");
this.value="";
return;
}

if(file.size>10*1024*1024){
message("Maximum image size is 10 MB.","error");
this.value="";
return;
}

selectedFile=file;

const reader=new FileReader();

reader.onload=function(e){
document.getElementById("avatarPreview").src=e.target.result;
};

reader.readAsDataURL(file);

clearMessage();

});

async function uploadAvatar(){

if(!selectedFile)return currentAvatarUrl;

const extension=
selectedFile.type==="image/png"?"png":
selectedFile.type==="image/webp"?"webp":"jpg";

const filePath=
currentUser.id+"/profile."+extension;

message("Uploading profile picture...","info");

const {error}=await supabaseClient.storage
.from("avatars")
.upload(filePath,selectedFile,{
upsert:true,
contentType:selectedFile.type
});

if(error){
throw new Error("Image upload failed: "+error.message);
}

const {data}=supabaseClient.storage
.from("avatars")
.getPublicUrl(filePath);

if(!data.publicUrl){
throw new Error("Could not get profile picture URL.");
}

return data.publicUrl+"?v="+Date.now();
}

async function saveProfile(){

const button=document.getElementById("saveButton");

button.disabled=true;
button.textContent="Saving...";

try{

const name=document.getElementById("fullName").value.trim();
const phone=document.getElementById("phone").value.trim();
const role=document.getElementById("role").value.trim();
const bio=document.getElementById("bio").value.trim();

if(!name){
throw new Error("Please enter your full name.");
}

let avatarUrl=currentAvatarUrl;

if(selectedFile){
avatarUrl=await uploadAvatar();
}

message("Saving your profile...","info");

const {error}=await supabaseClient
.from("Profile")
.upsert({
id:currentUser.id,
"full name":name,
email:currentUser.email,
phone:phone,
role:role,
bio:bio,
avatar_url:avatarUrl
},{onConflict:"id"});

if(error){
throw new Error(error.message);
}

currentAvatarUrl=avatarUrl;
selectedFile=null;
document.getElementById("photoInput").value="";

message(
"Profile updated successfully! ✓ Redirecting to Home...",
"success"
);

setTimeout(()=>{
location.href="index.html";
},1000);

}catch(error){

console.error(error);

message(error.message,"error");

button.disabled=false;
button.textContent="💾 Save Profile";

}

}

document.getElementById("saveButton")
.addEventListener("click",saveProfile);

document.addEventListener("DOMContentLoaded",loadProfile);
</script>

</body>
</html>
