<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Kormiva Profile — Manage your professional profile.">
<meta name="theme-color" content="#2563eb">

<title>Kormiva — My Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --primary:#2563eb;
  --primary-dark:#1d4ed8;
  --secondary:#06b6d4;
  --dark:#0f172a;
  --text:#334155;
  --muted:#64748b;
  --light:#f8fafc;
  --white:#ffffff;
  --border:#e2e8f0;
  --success:#16a34a;
  --danger:#dc2626;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at top right,rgba(37,99,235,.12),transparent 30%),
    linear-gradient(135deg,#eff6ff,#f8fafc);
  color:var(--dark);
}

body.dark{
  --dark:#f8fafc;
  --text:#cbd5e1;
  --muted:#94a3b8;
  --light:#020617;
  --white:#0f172a;
  --border:#334155;

  background:
    radial-gradient(circle at top right,rgba(37,99,235,.18),transparent 30%),
    #020617;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

body.dark header{
  background:rgba(15,23,42,.95);
}

.navbar{
  max-width:1200px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  text-decoration:none;
  font-size:28px;
  font-weight:900;
  color:var(--primary);
}

.logo span{
  color:var(--secondary);
}

.nav-links{
  display:flex;
  gap:10px;
  align-items:center;
}

.nav-links a,
.nav-links button{
  text-decoration:none;
  border:0;
  background:transparent;
  color:var(--text);
  font-weight:700;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

.nav-links a:hover,
.nav-links button:hover{
  background:#eff6ff;
  color:var(--primary);
}

.home-btn{
  background:var(--primary)!important;
  color:white!important;
}

.logout-btn{
  background:#fee2e2!important;
  color:#991b1b!important;
}

/* MAIN */

main{
  max-width:1000px;
  margin:45px auto;
  padding:0 20px;
}

.profile-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 25px 70px rgba(15,23,42,.10);
}

/* COVER */

.cover{
  height:170px;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.25),transparent 25%),
    linear-gradient(135deg,#2563eb,#06b6d4);
}

/* PROFILE HEADER */

.profile-header{
  padding:0 35px 30px;
  position:relative;
}

.avatar-area{
  display:flex;
  align-items:flex-end;
  gap:22px;
  margin-top:-65px;
}

.avatar{
  width:140px;
  height:140px;
  border-radius:50%;
  border:6px solid var(--white);
  background:linear-gradient(135deg,#dbeafe,#cffafe);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:0 10px 35px rgba(15,23,42,.18);
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.avatar-placeholder{
  font-size:55px;
}

.profile-title{
  padding-bottom:8px;
}

.profile-title h1{
  font-size:30px;
  margin-bottom:4px;
}

.profile-title p{
  color:var(--muted);
}

/* CONTENT */

.profile-content{
  padding:0 35px 35px;
}

.section-title{
  font-size:21px;
  margin:25px 0 18px;
  padding-bottom:10px;
  border-bottom:1px solid var(--border);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  font-weight:800;
  margin-bottom:7px;
  color:var(--text);
}

input,
textarea{
  width:100%;
  border:1px solid var(--border);
  background:var(--white);
  color:var(--dark);
  border-radius:12px;
  padding:14px;
  font-size:15px;
  outline:none;
  font-family:inherit;
  transition:.2s;
}

input:focus,
textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(37,99,235,.10);
}

input[readonly]{
  background:#f1f5f9;
  cursor:not-allowed;
}

body.dark input[readonly]{
  background:#1e293b;
}

textarea{
  min-height:130px;
  resize:vertical;
}

/* PHOTO */

.photo-box{
  margin-bottom:25px;
  padding:18px;
  border:1px dashed #93c5fd;
  background:#eff6ff;
  border-radius:15px;
}

body.dark .photo-box{
  background:#172554;
  border-color:#1d4ed8;
}

.photo-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.photo-info strong{
  display:block;
  margin-bottom:4px;
}

.photo-info small{
  color:var(--muted);
}

.photo-button{
  border:0;
  background:var(--primary);
  color:white;
  padding:12px 18px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}

.photo-button:hover{
  background:var(--primary-dark);
}

/* SAVE */

.actions{
  margin-top:30px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.save-btn{
  flex:1;
  min-width:220px;
  border:0;
  background:var(--primary);
  color:white;
  padding:16px;
  border-radius:12px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(37,99,235,.20);
}

.save-btn:hover{
  background:var(--primary-dark);
  transform:translateY(-1px);
}

.save-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.cancel-btn{
  border:1px solid var(--border);
  background:var(--white);
  color:var(--text);
  padding:16px 22px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

/* MESSAGE */

.message{
  display:none;
  margin-top:20px;
  padding:14px 16px;
  border-radius:12px;
  font-weight:700;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
  border:1px solid #bbf7d0;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fecaca;
}

.message.info{
  display:block;
  background:#dbeafe;
  color:#1e40af;
  border:1px solid #bfdbfe;
}

/* USER INFO */

.account-info{
  margin-top:25px;
  padding:18px;
  border-radius:15px;
  background:#f8fafc;
  border:1px solid var(--border);
}

body.dark .account-info{
  background:#1e293b;
}

.account-info strong{
  display:block;
  margin-bottom:5px;
}

.account-info span{
  color:var(--muted);
  font-size:14px;
}

/* FOOTER */

footer{
  text-align:center;
  padding:30px 20px;
  color:var(--muted);
}

/* MOBILE */

@media(max-width:700px){

  .navbar{
    padding:13px 15px;
  }

  .logo{
    font-size:24px;
  }

  .nav-links{
    gap:4px;
  }

  .nav-links a,
  .nav-links button{
    padding:8px;
    font-size:13px;
  }

  main{
    margin:25px auto;
    padding:0 12px;
  }

  .cover{
    height:130px;
  }

  .profile-header{
    padding:0 20px 25px;
  }

  .avatar-area{
    margin-top:-55px;
    align-items:center;
    flex-direction:column;
    text-align:center;
    gap:12px;
  }

  .avatar{
    width:115px;
    height:115px;
  }

  .avatar-placeholder{
    font-size:45px;
  }

  .profile-title h1{
    font-size:25px;
  }

  .profile-content{
    padding:0 20px 25px;
  }

  .form-grid{
    grid-template-columns:1fr;
    gap:16px;
  }

  .form-group.full{
    grid-column:auto;
  }

  .photo-row{
    flex-direction:column;
    align-items:stretch;
  }

  .photo-button{
    width:100%;
  }

  .actions{
    flex-direction:column;
  }

  .save-btn,
  .cancel-btn{
    width:100%;
  }

}

</style>
</head>

<body>

<header>

  <div class="navbar">

    <a href="index.html" class="logo">
      Kormiva<span>.</span>
    </a>

    <div class="nav-links">

      <a href="index.html" class="home-btn">
        🏠 Home
      </a>

      <button onclick="toggleDarkMode()">
        🌙
      </button>

      <button onclick="logout()" class="logout-btn">
        Logout
      </button>

    </div>

  </div>

</header>


<main>

  <div class="profile-card">

    <div class="cover"></div>

    <div class="profile-header">

      <div class="avatar-area">

        <div class="avatar">

          <div
            id="avatarPlaceholder"
            class="avatar-placeholder">
            👤
          </div>

          <img
            id="avatarImage"
            alt="Profile Picture">

        </div>

        <div class="profile-title">

          <h1 id="profileName">
            My Profile
          </h1>

          <p>
            Manage your Kormiva profile
          </p>

        </div>

      </div>

    </div>


    <div class="profile-content">

      <div
        id="message"
        class="message">
      </div>


      <h2 class="section-title">
        📷 Profile Picture
      </h2>

      <div class="photo-box">

        <div class="photo-row">

          <div class="photo-info">

            <strong>
              Upload your profile picture
            </strong>

            <small>
              JPEG, PNG or WebP • Maximum 10 MB
            </small>

          </div>

          <button
            type="button"
            class="photo-button"
            onclick="document.getElementById('photoInput').click()">

            📷 Change Profile Picture

          </button>

        </div>

        <input
          type="file"
          id="photoInput"
          accept="image/jpeg,image/png,image/webp"
          style="display:none">

      </div>


      <h2 class="section-title">
        👤 Personal Information
      </h2>


      <div class="form-grid">

        <div class="form-group">

          <label for="fullName">
            Full Name
          </label>

          <input
            id="fullName"
            type="text"
            placeholder="Enter your full name">

        </div>


        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            readonly>

        </div>


        <div class="form-group">

          <label for="phone">
            Phone
          </label>

          <input
            id="phone"
            type="tel"
            placeholder="Enter your phone number">

        </div>


        <div class="form-group">

          <label for="role">
            Role
          </label>

          <input
            id="role"
            type="text"
            placeholder="Student, Job Seeker, Freelancer...">

        </div>


        <div class="form-group full">

          <label for="bio">
            Bio
          </label>

          <textarea
            id="bio"
            placeholder="Tell people about yourself..."></textarea>

        </div>

      </div>


      <div class="account-info">

        <strong>
          🆔 Account ID
        </strong>

        <span id="accountId">
          Loading...
        </span>

      </div>


      <div class="actions">

        <button
          type="button"
          id="saveButton"
          class="save-btn"
          onclick="saveProfile()">

          💾 Save Profile

        </button>

        <button
          type="button"
          class="cancel-btn"
          onclick="goHome()">

          ← Back to Home

        </button>

      </div>

    </div>

  </div>

</main>


<footer>

  © 2026 Kormiva — Connecting people with opportunities.

</footer>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://jobhfmjbvxstyjlpxnpp.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_imDL1J97UKXC7wDh8awxBw_VtzH1N60";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;

let selectedPhoto = null;

let currentAvatarUrl = "";


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type){

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message " + type;

}


/* =========================================================
   GET CURRENT USER
========================================================= */

async function getCurrentUser(){

  const {
    data,
    error
  } = await supabaseClient.auth.getUser();

  if(error){

    console.error(error);

    return null;

  }

  return data.user;

}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

  showMessage(
    "Loading your profile...",
    "info"
  );


  currentUser =
    await getCurrentUser();


  if(!currentUser){

    showMessage(
      "You are not logged in. Redirecting to login...",
      "error"
    );

    setTimeout(function(){

      location.href="auth.html";

    },1200);

    return;

  }


  document.getElementById("email").value =
    currentUser.email || "";


  document.getElementById("accountId").textContent =
    currentUser.id;


  /*
    IMPORTANT:

    Your real database column is:
    "Full Name"

    NOT:
    full_name
  */


  const {
    data:profile,
    error
  } = await supabaseClient
    .from("Profile")
    .select(`
      "Id",
      "Full Name",
      "Phone",
      avatar_url,
      bio,
      role,
      created_at,
      email
    `)
    .eq("Id",currentUser.id)
    .maybeSingle();


  if(error){

    console.error(
      "Profile loading error:",
      error
    );

    showMessage(
      "Could not load profile: " +
      error.message,
      "error"
    );

    return;

  }


  if(profile){

    document.getElementById("fullName").value =
      profile["Full Name"] || "";

    document.getElementById("email").value =
      profile.email || currentUser.email || "";

    document.getElementById("phone").value =
      profile.Phone || "";

    document.getElementById("role").value =
      profile.role || "";

    document.getElementById("bio").value =
      profile.bio || "";


    currentAvatarUrl =
      profile.avatar_url || "";


    if(currentAvatarUrl){

      setAvatar(currentAvatarUrl);

    }


    document.getElementById("profileName").textContent =
      profile["Full Name"] ||
      "My Profile";


    hideMessage();

  }else{

    /*
      If profile row doesn't exist,
      create it automatically.
    */

    const {error:createError} =
      await supabaseClient
        .from("Profile")
        .insert({

          "Id":currentUser.id,

          "Full Name":
            currentUser.user_metadata?.full_name ||
            currentUser.user_metadata?.name ||
            "",

          Phone:
            currentUser.user_metadata?.phone ||
            "",

          avatar_url:"",

          bio:"",

          role:
            currentUser.user_metadata?.role ||
            "",

          email:
            currentUser.email || ""

        });


    if(createError){

      console.error(
        "Profile creation error:",
        createError
      );

      showMessage(
        "Profile row could not be created: " +
        createError.message,
        "error"
      );

      return;

    }


    document.getElementById("fullName").value =
      currentUser.user_metadata?.full_name ||
      currentUser.user_metadata?.name ||
      "";

    document.getElementById("phone").value =
      currentUser.user_metadata?.phone || "";

    document.getElementById("role").value =
      currentUser.user_metadata?.role || "";

    hideMessage();

  }

}


/* =========================================================
   AVATAR
========================================================= */

function setAvatar(url){

  const image =
    document.getElementById("avatarImage");

  const placeholder =
    document.getElementById("avatarPlaceholder");


  image.src = url;

  image.style.display = "block";

  placeholder.style.display = "none";


  image.onerror = function(){

    image.style.display = "none";

    placeholder.style.display = "flex";

  };

}


/* =========================================================
   PHOTO SELECT
========================================================= */

document
  .getElementById("photoInput")
  .addEventListener(
    "change",
    function(event){

      const file =
        event.target.files[0];


      if(!file){

        return;

      }


      const allowedTypes = [

        "image/jpeg",
        "image/png",
        "image/webp"

      ];


      if(!allowedTypes.includes(file.type)){

        showMessage(
          "Only JPEG, PNG or WebP images are allowed.",
          "error"
        );

        event.target.value = "";

        return;

      }


      const maxSize =
        10 * 1024 * 1024;


      if(file.size > maxSize){

        showMessage(
          "Image is too large. Maximum size is 10 MB.",
          "error"
        );

        event.target.value = "";

        return;

      }


      selectedPhoto = file;


      /*
        Show selected photo immediately.
      */

      const localUrl =
        URL.createObjectURL(file);

      setAvatar(localUrl);


      showMessage(
        "Profile picture selected. Press Save Profile to upload it.",
        "info"
      );

    }
  );


/* =========================================================
   UPLOAD PHOTO
========================================================= */

async function uploadProfilePhoto(){

  if(!selectedPhoto){

    return currentAvatarUrl;

  }


  if(!currentUser){

    throw new Error(
      "User is not logged in."
    );

  }


  showMessage(
    "Uploading profile picture...",
    "info"
  );


  const extension =
    selectedPhoto.name
      .split(".")
      .pop()
      .toLowerCase();


  /*
    One fixed folder per user.
    This prevents users from overwriting
    another user's profile picture.
  */

  const filePath =
    currentUser.id +
    "/profile." +
    extension;


  const {
    error:uploadError
  } =
    await supabaseClient
      .storage
      .from("avatars")
      .upload(
        filePath,
        selectedPhoto,
        {
          upsert:true,
          contentType:selectedPhoto.type,
          cacheControl:"3600"
        }
      );


  if(uploadError){

    throw uploadError;

  }


  const {
    data:publicData
  } =
    supabaseClient
      .storage
      .from("avatars")
      .getPublicUrl(filePath);


  if(!publicData ||
     !publicData.publicUrl){

    throw new Error(
      "Could not create profile picture URL."
    );

  }


  /*
    Cache-busting:
    ensures the new picture appears
    immediately instead of old cached picture.
  */

  const finalUrl =
    publicData.publicUrl +
    "?v=" +
    Date.now();


  return finalUrl;

}


/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile(){

  if(!currentUser){

    showMessage(
      "Please login first.",
      "error"
    );

    return;

  }


  const saveButton =
    document.getElementById("saveButton");


  const name =
    document
      .getElementById("fullName")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const role =
    document
      .getElementById("role")
      .value
      .trim();


  const bio =
    document
      .getElementById("bio")
      .value
      .trim();


  if(!name){

    showMessage(
      "Please enter your full name.",
      "error"
    );

    return;

  }


  saveButton.disabled = true;

  saveButton.textContent =
    "Saving...";


  try{

    /*
      Upload picture first.
    */

    let avatarUrl =
      currentAvatarUrl;


    if(selectedPhoto){

      avatarUrl =
        await uploadProfilePhoto();

    }


    showMessage(
      "Saving your profile...",
      "info"
    );


    /*
      IMPORTANT:

      Exact database column names:
      "Id"
      "Full Name"
      "Phone"
      avatar_url
      bio
      role
      email
    */

    const {
      error
    } =
      await supabaseClient
        .from("Profile")
        .update({

          "Full Name":name,

          Phone:phone,

          role:role,

          bio:bio,

          avatar_url:
            avatarUrl || "",

          email:
            currentUser.email || ""

        })
        .eq(
          "Id",
          currentUser.id
        );


    if(error){

      throw error;

    }


    /*
      Update local values.
    */

    currentAvatarUrl =
      avatarUrl;


    selectedPhoto = null;


    document.getElementById(
      "photoInput"
    ).value = "";


    document.getElementById(
      "profileName"
    ).textContent = name;


    if(avatarUrl){

      setAvatar(avatarUrl);

    }


    showMessage(
      "Profile updated successfully! ✓ Redirecting to Home...",
      "success"
    );


    /*
      IMPORTANT:
      After saving everything,
      user goes to Home page.
    */

    setTimeout(function(){

      location.href =
        "index.html";

    },1200);


  }catch(error){

    console.error(
      "SAVE PROFILE ERROR:",
      error
    );


    showMessage(
      "Profile could not be saved: " +
      error.message,
      "error"
    );


    saveButton.disabled = false;

    saveButton.textContent =
      "💾 Save Profile";

  }

}


/* =========================================================
   HIDE MESSAGE
========================================================= */

function hideMessage(){

  const message =
    document.getElementById("message");

  message.className =
    "message";

  message.textContent = "";

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

  location.href =
    "index.html";

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if(error){

    showMessage(
      "Logout failed: " +
      error.message,
      "error"
    );

    return;

  }


  location.href =
    "index.html";

}


/* =========================================================
   DARK MODE
========================================================= */

function toggleDarkMode(){

  document.body.classList.toggle("dark");


  const enabled =
    document.body.classList.contains("dark");


  localStorage.setItem(
    "kormivaDarkMode",
    enabled ? "on" : "off"
  );

}


function loadDarkMode(){

  const mode =
    localStorage.getItem(
      "kormivaDarkMode"
    );


  if(mode === "on"){

    document.body.classList.add("dark");

  }

}


/* =========================================================
   PAGE START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadDarkMode();

    loadProfile();

  }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      goHome();

    }

  }
);

</script>

</body>
</html>
