<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kormiva — Login / Sign Up</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
min-height:100vh;
background:linear-gradient(135deg,#ecfdf5,#eff6ff);
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.box{
width:100%;max-width:460px;background:#fff;
border-radius:25px;padding:32px;
box-shadow:0 25px 70px rgba(15,23,42,.12)
}
.logo{
display:block;text-align:center;text-decoration:none;
font-size:32px;font-weight:900;color:#16a34a;margin-bottom:8px
}
.subtitle{text-align:center;color:#64748b;margin-bottom:25px}
.tabs{display:flex;gap:5px;background:#f1f5f9;padding:5px;border-radius:12px;margin-bottom:25px}
.tab{
flex:1;border:0;background:transparent;padding:12px;
font-weight:800;border-radius:9px;cursor:pointer
}
.tab.active{background:#16a34a;color:white}
label{display:block;font-weight:700;margin:13px 0 6px}
input{
width:100%;padding:13px 14px;border:1px solid #cbd5e1;
border-radius:10px;font-size:15px;outline:none
}
input:focus{border-color:#16a34a;box-shadow:0 0 0 3px #dcfce7}
button.submit{
width:100%;margin-top:20px;padding:14px;border:0;
border-radius:11px;background:#16a34a;color:white;
font-size:16px;font-weight:800;cursor:pointer
}
button.submit:disabled{opacity:.6}
.message{
display:none;margin-top:15px;padding:12px;border-radius:10px;
font-size:14px
}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.back{
display:block;text-align:center;margin-top:20px;
color:#16a34a;text-decoration:none;font-weight:700
}
.hidden{display:none}
</style>
</head>

<body>

<div class="box">

<a href="index.html" class="logo">Kormiva</a>
<p class="subtitle">Build your better future</p>

<div class="tabs">
<button class="tab active" id="loginTab" onclick="showLogin()">Login</button>
<button class="tab" id="signupTab" onclick="showSignup()">Sign Up</button>
</div>

<form id="loginForm">

<label>Email</label>
<input id="loginEmail" type="email" required placeholder="Enter your email">

<label>Password</label>
<input id="loginPassword" type="password" required placeholder="Enter your password">

<button class="submit" type="submit">Login</button>

</form>

<form id="signupForm" class="hidden">

<label>Full Name</label>
<input id="signupName" type="text" required placeholder="Your full name">

<label>Email</label>
<input id="signupEmail" type="email" required placeholder="Your email">

<label>Password</label>
<input id="signupPassword" type="password" minlength="6" required placeholder="Minimum 6 characters">

<label>Phone</label>
<input id="signupPhone" type="tel" placeholder="Phone number">

<label>Role</label>
<input id="signupRole" type="text" placeholder="e.g. Student, Job Seeker">

<button class="submit" type="submit">Create Account</button>

</form>

<div id="message" class="message"></div>

<a href="index.html" class="back">← Back to Home</a>

</div>

<script>
const SUPABASE_URL =
"https://jobhfmjbvxstyjlpxnpp.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_imDL1J97UKXC7wDh8awxBw_VtzH1N60";

const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

function showMessage(text,type){

const box=document.getElementById("message");

box.textContent=text;
box.className="message "+type;

}

function showLogin(){

document.getElementById("loginForm").classList.remove("hidden");
document.getElementById("signupForm").classList.add("hidden");

document.getElementById("loginTab").classList.add("active");
document.getElementById("signupTab").classList.remove("active");

document.getElementById("message").className="message";
}

function showSignup(){

document.getElementById("loginForm").classList.add("hidden");
document.getElementById("signupForm").classList.remove("hidden");

document.getElementById("loginTab").classList.remove("active");
document.getElementById("signupTab").classList.add("active");

document.getElementById("message").className="message";
}

document.getElementById("loginForm").addEventListener("submit",async function(e){

e.preventDefault();

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

showMessage("Logging in...","success");

const {data,error}=await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){
showMessage(error.message,"error");
return;
}

showMessage("Login successful! Redirecting...","success");

setTimeout(()=>{
location.href="profile.html";
},700);

});

document.getElementById("signupForm").addEventListener("submit",async function(e){

e.preventDefault();

const name=document.getElementById("signupName").value.trim();
const email=document.getElementById("signupEmail").value.trim();
const password=document.getElementById("signupPassword").value;
const phone=document.getElementById("signupPhone").value.trim();
const role=document.getElementById("signupRole").value.trim();

showMessage("Creating your account...","success");

const {data,error}=await supabaseClient.auth.signUp({

email,
password,

options:{
data:{
full_name:name,
name:name,
phone:phone,
role:role
}
}

});

if(error){
showMessage(error.message,"error");
return;
}

if(!data.user){
showMessage("Account could not be created.","error");
return;
}

/*
Create profile record.
This requires public.Profile to have:
user_id, full_name, email, phone, role, bio, avatar_url
*/

const {error:profileError}=await supabaseClient
.from("Profile")
.insert({
user_id:data.user.id,
full_name:name,
email:email,
phone:phone,
role:role,
bio:"",
avatar_url:""
});

if(profileError){
console.log("Profile insert:",profileError.message);
}

if(data.session){

showMessage("Account created! Opening your profile...","success");

setTimeout(()=>{
location.href="profile.html";
},800);

}else{

showMessage(
"Account created. Please check your email to verify your account.",
"success"
);

}

});
</script>

</body>
</html>
