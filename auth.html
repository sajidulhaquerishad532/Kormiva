<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0">

<title>Kormiva — Login & Sign Up</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(37,99,235,.15),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(6,182,212,.15),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #eff6ff,
      #ffffff
    );

  color:#0f172a;
}

.auth-wrapper{
  width:100%;
  max-width:460px;
}

.logo{
  text-align:center;
  font-size:35px;
  font-weight:900;
  color:#2563eb;
  margin-bottom:20px;
}

.logo span{
  color:#06b6d4;
}

.card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:25px;
  padding:30px;

  box-shadow:
    0 25px 70px rgba(15,23,42,.12);
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#f1f5f9;
  padding:5px;
  border-radius:12px;
  margin-bottom:25px;
}

.tab{
  border:0;
  background:transparent;
  padding:12px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
  color:#64748b;
}

.tab.active{
  background:white;
  color:#2563eb;
  box-shadow:0 2px 8px rgba(15,23,42,.08);
}

h1{
  font-size:28px;
  margin-bottom:8px;
}

.subtitle{
  color:#64748b;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:17px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #cbd5e1;
  border-radius:11px;
  outline:none;
  font-size:16px;
}

input:focus{
  border-color:#2563eb;
  box-shadow:
    0 0 0 4px rgba(37,99,235,.1);
}

.submit{
  width:100%;
  border:0;
  padding:14px;
  border-radius:11px;
  background:linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
  );
  color:white;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
}

.submit:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:13px;
  border-radius:10px;
  margin-bottom:17px;
  font-size:14px;
  font-weight:700;
}

.message.show{
  display:block;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.info{
  background:#dbeafe;
  color:#1d4ed8;
}

.home{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#2563eb;
  text-decoration:none;
  font-weight:700;
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:55px;
}

.password-btn{
  position:absolute;
  right:5px;
  top:5px;
  bottom:5px;
  width:45px;
  border:0;
  background:#f1f5f9;
  border-radius:8px;
  cursor:pointer;
}

</style>

</head>

<body>

<div class="auth-wrapper">

  <div class="logo">
    Kormi<span>va</span>
  </div>

  <div class="card">

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showLogin()">
        Login
      </button>

      <button
        class="tab"
        id="signupTab"
        onclick="showSignup()">
        Sign Up
      </button>

    </div>


    <div
      id="message"
      class="message">
    </div>


    <!-- LOGIN -->

    <div id="loginBox">

      <h1>Welcome Back 👋</h1>

      <p class="subtitle">
        Login to your Kormiva account.
      </p>

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          id="loginEmail"
          placeholder="you@example.com"
          autocomplete="email">

      </div>


      <div class="form-group">

        <label>Password</label>

        <div class="password-wrap">

          <input
            type="password"
            id="loginPassword"
            placeholder="Your password"
            autocomplete="current-password">

          <button
            type="button"
            class="password-btn"
            onclick="togglePassword('loginPassword',this)">
            👁️
          </button>

        </div>

      </div>


      <button
        class="submit"
        id="loginButton"
        onclick="login()">

        Login

      </button>

    </div>


    <!-- SIGNUP -->

    <div
      id="signupBox"
      style="display:none;">

      <h1>Create Account 🚀</h1>

      <p class="subtitle">
        Join Kormiva and build your future.
      </p>


      <div class="form-group">

        <label>Full Name</label>

        <input
          type="text"
          id="signupName"
          placeholder="Your full name"
          autocomplete="name">

      </div>


      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          id="signupEmail"
          placeholder="you@example.com"
          autocomplete="email">

      </div>


      <div class="form-group">

        <label>Password</label>

        <div class="password-wrap">

          <input
            type="password"
            id="signupPassword"
            placeholder="Minimum 6 characters"
            autocomplete="new-password">

          <button
            type="button"
            class="password-btn"
            onclick="togglePassword('signupPassword',this)">
            👁️
          </button>

        </div>

      </div>


      <button
        class="submit"
        id="signupButton"
        onclick="signup()">

        Create Account

      </button>

    </div>


    <a
      href="index.html"
      class="home">
      ← Back to Home
    </a>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://jobhfmjbvxstyjlpxnpp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_imDL1J97UKXC7wDh8awxBw_VtzH1N60";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function showMessage(text,type){

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message show " + type;

}


function clearMessage(){

  const message =
    document.getElementById("message");

  message.textContent = "";

  message.className = "message";

}


function showLogin(){

  document.getElementById("loginBox")
    .style.display = "block";

  document.getElementById("signupBox")
    .style.display = "none";

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("signupTab")
    .classList.remove("active");

  clearMessage();

}


function showSignup(){

  document.getElementById("loginBox")
    .style.display = "none";

  document.getElementById("signupBox")
    .style.display = "block";

  document.getElementById("loginTab")
    .classList.remove("active");

  document.getElementById("signupTab")
    .classList.add("active");

  clearMessage();

}


function togglePassword(id,button){

  const input =
    document.getElementById(id);

  if(input.type === "password"){

    input.type = "text";
    button.textContent = "🙈";

  }else{

    input.type = "password";
    button.textContent = "👁️";

  }

}


async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!email || !password){

    showMessage(
      "Please enter email and password.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById("loginButton");

  button.disabled = true;
  button.textContent = "Logging in...";

  clearMessage();


  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
      });


    if(error){

      showMessage(
        error.message,
        "error"
      );

      return;

    }


    if(!data.user){

      showMessage(
        "Login failed. Please try again.",
        "error"
      );

      return;

    }


    showMessage(
      "Login successful! Redirecting...",
      "success"
    );


    setTimeout(
      function(){

        window.location.href =
          "profile.html";

      },
      700
    );


  }catch(error){

    console.error(error);

    showMessage(
      "Something went wrong.",
      "error"
    );

  }finally{

    button.disabled = false;
    button.textContent = "Login";

  }

}


async function signup(){

  const name =
    document
      .getElementById("signupName")
      .value
      .trim();

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("signupPassword")
      .value;


  if(!name || !email || !password){

    showMessage(
      "Please fill in all fields.",
      "error"
    );

    return;

  }


  if(password.length < 6){

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById("signupButton");

  button.disabled = true;
  button.textContent = "Creating account...";

  clearMessage();


  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{
          data:{
            full_name:name
          }
        }

      });


    if(error){

      showMessage(
        error.message,
        "error"
      );

      return;

    }


    /*
      If email confirmation is disabled,
      user will be logged in immediately.
    */

    if(data.user){

      /*
        Create Profile row.
        If RLS blocks this, the user can still
        login but Profile table policy must
        be fixed in Supabase.
      */

      const {
        error:profileError
      } =
        await supabaseClient
          .from("Profile")
          .upsert({

            "Id":data.user.id,

            "Full Name":name,

            email:email

          });


      if(profileError){

        console.warn(
          "Profile creation warning:",
          profileError
        );

      }


      if(data.session){

        showMessage(
          "Account created successfully! Redirecting...",
          "success"
        );

        setTimeout(
          function(){

            window.location.href =
              "profile.html";

          },
          700
        );

      }else{

        showMessage(
          "Account created. Please check your email to confirm your account.",
          "success"
        );

        showLogin();

      }

    }


  }catch(error){

    console.error(error);

    showMessage(
      "Could not create account.",
      "error"
    );

  }finally{

    button.disabled = false;
    button.textContent = "Create Account";

  }

}


/*
  If already logged in,
  send user directly to Profile.
*/

async function checkExistingSession(){

  const {
    data
  } =
    await supabaseClient.auth.getSession();

  if(data.session){

    window.location.href =
      "profile.html";

  }

}


checkExistingSession();

</script>

</body>
</html>
