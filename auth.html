<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kormiva — Login & Sign Up</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;

  background:
    radial-gradient(
      circle at 10% 20%,
      rgba(37,99,235,.15),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(6,182,212,.15),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #eff6ff,
      #ffffff
    );

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  color:#0f172a;
}

.auth-container{
  width:100%;
  max-width:450px;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  color:#2563eb;
  margin-bottom:8px;
}

.logo span{
  color:#06b6d4;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin-bottom:25px;
}

.auth-card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:25px;
  padding:32px;

  box-shadow:
    0 25px 70px rgba(15,23,42,.12);
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#f1f5f9;
  padding:5px;
  border-radius:12px;
  margin-bottom:25px;
}

.tab{
  border:0;
  background:transparent;
  padding:12px;
  border-radius:9px;
  font-weight:700;
  color:#64748b;
  cursor:pointer;
}

.tab.active{
  background:white;
  color:#2563eb;

  box-shadow:
    0 3px 10px rgba(15,23,42,.08);
}

.form{
  display:none;
}

.form.active{
  display:block;
}

.form-group{
  margin-bottom:17px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
  font-size:14px;
}

input{
  width:100%;
  padding:14px 15px;

  border:1px solid #cbd5e1;
  border-radius:11px;

  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#2563eb;

  box-shadow:
    0 0 0 4px rgba(37,99,235,.1);
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:55px;
}

.show-password{
  position:absolute;

  right:10px;
  top:50%;

  transform:translateY(-50%);

  border:0;
  background:#eff6ff;
  color:#2563eb;

  padding:7px 9px;
  border-radius:7px;

  cursor:pointer;
}

.submit-btn{
  width:100%;

  border:0;
  background:#2563eb;
  color:white;

  padding:15px;
  border-radius:11px;

  font-size:16px;
  font-weight:800;

  cursor:pointer;
  margin-top:5px;
}

.submit-btn:hover{
  background:#1d4ed8;
}

.submit-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;

  padding:12px 14px;
  border-radius:10px;

  margin-bottom:17px;

  font-size:14px;
  font-weight:600;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.back-home{
  display:block;

  text-align:center;
  margin-top:20px;

  color:#2563eb;
  text-decoration:none;

  font-weight:700;
}

@media(max-width:500px){

  .auth-card{
    padding:23px;
  }

  .logo{
    font-size:28px;
  }

}

</style>
</head>

<body>

<div class="auth-container">

  <div class="logo">
    Kormi<span>va</span>
  </div>

  <p class="subtitle">
    Connect. Learn. Grow. Build your better future.
  </p>

  <div class="auth-card">

    <!-- TABS -->

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        type="button"
        onclick="showForm('login')">

        Login

      </button>

      <button
        class="tab"
        id="signupTab"
        type="button"
        onclick="showForm('signup')">

        Sign Up

      </button>

    </div>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message">
    </div>


    <!-- LOGIN -->

    <form
      id="loginForm"
      class="form active">

      <div class="form-group">

        <label for="loginEmail">
          Email
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="loginPassword">
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('loginPassword',this)">

            👁️

          </button>

        </div>

      </div>


      <button
        type="submit"
        class="submit-btn"
        id="loginButton">

        Login

      </button>

    </form>


    <!-- SIGN UP -->

    <form
      id="signupForm"
      class="form">

      <div class="form-group">

        <label for="signupName">
          Full Name
        </label>

        <input
          type="text"
          id="signupName"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

      </div>


      <div class="form-group">

        <label for="signupEmail">
          Email
        </label>

        <input
          type="email"
          id="signupEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="signupPassword">
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="signupPassword"
            placeholder="Minimum 6 characters"
            minlength="6"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('signupPassword',this)">

            👁️

          </button>

        </div>

      </div>


      <button
        type="submit"
        class="submit-btn"
        id="signupButton">

        Create Account

      </button>

    </form>


    <!-- BACK HOME -->

    <a
      href="index.html"
      class="back-home">

      ← Back to Kormiva Home

    </a>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
  "https://jobhfmjbvxstyjlpxnpp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_imDL1J97UKXC7wDh8awxBw_VtzH1N60";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   FORM SWITCH
========================================= */

function showForm(type){

  const loginForm =
    document.getElementById("loginForm");

  const signupForm =
    document.getElementById("signupForm");

  const loginTab =
    document.getElementById("loginTab");

  const signupTab =
    document.getElementById("signupTab");

  clearMessage();

  if(type === "login"){

    loginForm.classList.add("active");
    signupForm.classList.remove("active");

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

  }else{

    signupForm.classList.add("active");
    loginForm.classList.remove("active");

    signupTab.classList.add("active");
    loginTab.classList.remove("active");

  }

}


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

function togglePassword(inputId,button){

  const input =
    document.getElementById(inputId);

  if(input.type === "password"){

    input.type = "text";
    button.textContent = "🙈";

  }else{

    input.type = "password";
    button.textContent = "👁️";

  }

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message " + type;

}

function clearMessage(){

  const message =
    document.getElementById("message");

  message.textContent = "";

  message.className = "message";

}


/* =========================================
   SIGN UP
========================================= */

document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();

      const name =
        document
          .getElementById("signupName")
          .value
          .trim();

      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("signupPassword")
          .value;

      const button =
        document.getElementById("signupButton");

      button.disabled = true;
      button.textContent = "Creating account...";

      clearMessage();

      try{

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                full_name: name
              }

            }

          });


        if(error){

          showMessage(
            error.message,
            "error"
          );

          return;

        }


        /*
          Email confirmation ON থাকলে
          session পাওয়া যাবে না।
        */

        if(data.session){

          showMessage(
            "Account created successfully!",
            "success"
          );

          document
            .getElementById("signupForm")
            .reset();

          setTimeout(function(){

            window.location.href =
              "index.html";

          },1000);

        }else{

          showMessage(
            "Account created! Please check your email to confirm your account, then login.",
            "success"
          );

          document
            .getElementById("signupForm")
            .reset();

          setTimeout(function(){

            showForm("login");

          },1200);

        }

      }catch(error){

        showMessage(
          error.message ||
          "Something went wrong. Please try again.",
          "error"
        );

      }finally{

        button.disabled = false;
        button.textContent = "Create Account";

      }

    }
  );


/* =========================================
   LOGIN
========================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      const button =
        document.getElementById("loginButton");

      button.disabled = true;
      button.textContent = "Logging in...";

      clearMessage();

      try{

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if(error){

          showMessage(
            error.message,
            "error"
          );

          return;

        }


        showMessage(
          "Login successful! Opening Kormiva...",
          "success"
        );


        setTimeout(function(){

          window.location.href =
            "index.html";

        },800);

      }catch(error){

        showMessage(
          error.message ||
          "Login failed. Please try again.",
          "error"
        );

      }finally{

        button.disabled = false;
        button.textContent = "Login";

      }

    }
  );


/* =========================================
   IMPORTANT:
   এখানে আর automatic redirect নেই।
   
   তাই auth.html খুললেই
   user-কে index.html-এ পাঠাবে না।
========================================= */


/* =========================================
   START
========================================= */

console.log("Kormiva authentication page loaded.");

</script>

</body>
</html>
