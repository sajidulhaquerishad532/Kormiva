<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kormiva — Login / Sign Up</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;min-height:100vh;padding:20px;
display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#eff6ff,#ecfeff)
}
.box{
width:100%;max-width:470px;background:#fff;
padding:30px;border-radius:24px;
box-shadow:0 25px 70px rgba(15,23,42,.14)
}
.logo{
display:block;text-align:center;text-decoration:none;
font-size:32px;font-weight:900;color:#2563eb
}
.subtitle{text-align:center;color:#64748b;margin:6px 0 25px}
.tabs{
display:flex;gap:5px;background:#f1f5f9;
padding:5px;border-radius:12px;margin-bottom:20px
}
.tab{
flex:1;border:0;padding:12px;border-radius:9px;
font-weight:800;cursor:pointer
}
.tab.active{background:#2563eb;color:#fff}
label{display:block;font-weight:700;margin:13px 0 6px}
input{
width:100%;padding:13px;border:1px solid #cbd5e1;
border-radius:10px;outline:none
}
input:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px #dbeafe
}
.submit{
width:100%;margin-top:20px;padding:14px;
border:0;border-radius:11px;background:#2563eb;
color:#fff;font-weight:800;font-size:16px;cursor:pointer
}
.submit:disabled{opacity:.6}
.message{
display:none;margin-top:15px;padding:12px;border-radius:10px;
font-size:14px
}
.message.show{display:block}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.back{
display:block;text-align:center;margin-top:20px;
color:#2563eb;text-decoration:none;font-weight:700
}
.hidden{display:none}
</style>
</head>

<body>

<div class="box">

<a href="index.html" class="logo">Kormiva</a>
<p class="subtitle">Build your better future</p>

<div class="tabs">
<button class="tab active" id="loginTab" onclick="showLogin()">Login</button>
<button class="tab" id="signupTab" onclick="showSignup()">Sign Up</button>
</div>

<form id="loginForm">

<label>Email</label>
<input id="loginEmail" type="email" required placeholder="Enter your email">

<label>Password</label>
<input id="loginPassword" type="password" required placeholder="Enter your password">

<button class="submit" id="loginButton">Login</button>

</form>

<form id="signupForm" class="hidden">

<label>Full Name</label>
<input id="signupName" type="text" required placeholder="Your full name">

<label>Email</label>
<input id="signupEmail" type="email" required placeholder="Your email">

<label>Password</label>
<input id="signupPassword" type="password" minlength="6" required placeholder="Minimum 6 characters">

<label>Phone</label>
<input id="signupPhone" type="tel" placeholder="Phone number">

<label>Role</label>
<input id="signupRole" type="text" placeholder="Student / Job Seeker / Freelancer">

<button class="submit" id="signupButton">Create Account</button>

</form>

<div id="message" class="message"></div>

<a class="back" href="index.html">← Back to Home</a>

</div>

<script>
const SUPABASE_URL="https://jobhfmjbvxstyjlpxnpp.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_imDL1J97UKXC7wDh8awxBw_VtzH1N60";

const supabaseClient=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

function msg(text,type){
const box=document.getElementById("message");
box.textContent=text;
box.className="message show "+type;
}

function clearMsg(){
document.getElementById("message").className="message";
}

function showLogin(){
document.getElementById("loginForm").classList.remove("hidden");
document.getElementById("signupForm").classList.add("hidden");
document.getElementById("loginTab").classList.add("active");
document.getElementById("signupTab").classList.remove("active");
clearMsg();
}

function showSignup(){
document.getElementById("loginForm").classList.add("hidden");
document.getElementById("signupForm").classList.remove("hidden");
document.getElementById("loginTab").classList.remove("active");
document.getElementById("signupTab").classList.add("active");
clearMsg();
}

document.getElementById("loginForm").addEventListener("submit",async e=>{

e.preventDefault();

const button=document.getElementById("loginButton");
button.disabled=true;
button.textContent="Logging in...";

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

const {error}=await supabaseClient.auth.signInWithPassword({
email,password
});

if(error){
msg(error.message,"error");
button.disabled=false;
button.textContent="Login";
return;
}

msg("Login successful! Opening your profile...","success");

setTimeout(()=>{
location.href="profile.html";
},700);

});

document.getElementById("signupForm").addEventListener("submit",async e=>{

e.preventDefault();

const button=document.getElementById("signupButton");
button.disabled=true;
button.textContent="Creating Account...";

const name=document.getElementById("signupName").value.trim();
const email=document.getElementById("signupEmail").value.trim();
const password=document.getElementById("signupPassword").value;
const phone=document.getElementById("signupPhone").value.trim();
const role=document.getElementById("signupRole").value.trim();

const {data,error}=await supabaseClient.auth.signUp({
email,
password,
options:{
data:{
full_name:name,
phone:phone,
role:role
}
}
});

if(error){
msg(error.message,"error");
button.disabled=false;
button.textContent="Create Account";
return;
}

if(!data.user){
msg("Account could not be created.","error");
button.disabled=false;
button.textContent="Create Account";
return;
}

/*
Profile table:
id
full name
email
phone
role
bio
avatar_url
created_at
*/

if(data.session){

const {error:profileError}=await supabaseClient
.from("Profile")
.upsert({
id:data.user.id,
"full name":name,
email:email,
phone:phone,
role:role,
bio:"",
avatar_url:""
},{onConflict:"id"});

if(profileError){
console.log("Profile creation:",profileError.message);
}

msg("Account created! Opening your profile...","success");

setTimeout(()=>{
location.href="profile.html";
},800);

}else{

msg(
"Account created. Please verify your email, then login.",
"success"
);

button.disabled=false;
button.textContent="Create Account";

}

});
</script>

</body>
</html>
